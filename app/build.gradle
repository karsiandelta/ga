plugins {
    id 'com.android.application'
}

def admob = new Properties()
rootProject.file("admob.properties").withInputStream { admob.load(it) }
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.karsiandelta.ahorcadoarcade'
    compileSdk 36

    defaultConfig {
        applicationId 'com.karsiandelta.ahorcadoarcade'
        minSdk 23
        targetSdk 36
        versionCode buildNumber
        versionName "1.3.${buildNumber}"
        manifestPlaceholders = [admobAppId: admob.getProperty("appId")]
        buildConfigField "String", "REWARDED_ID", "\"${admob.getProperty('rewardedId')}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
