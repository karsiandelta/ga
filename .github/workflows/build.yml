name: Compilar Ahorcado Arcade

on:
  push:
    branches: [ahorcado-arcade]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generar la página del juego con las fuentes dentro
        run: python3 tools/make_index.py

      - name: Compilar AAB y APK (sin firmar)
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Reunir archivos
        run: |
          set -e
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab out/AhorcadoArcade-sin-firmar.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/AhorcadoArcade-sin-firmar.apk
          ls -la out

      - name: Publicar los archivos sin firmar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ahorcado-v${{ github.run_number }}
          name: Ahorcado Arcade (compilación ${{ github.run_number }}, sin firmar)
          target_commitish: ahorcado-arcade
          body: |
            Archivos SIN FIRMAR, no se pueden instalar tal cual.
            La firma se hace aparte con la clave de subida, que no está en este repositorio.
          files: |
            out/AhorcadoArcade-sin-firmar.aab
            out/AhorcadoArcade-sin-firmar.apk
