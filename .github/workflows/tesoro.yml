name: Compilar Tesoro de Albacete

on:
  push:
    branches: [tesoro-albacete]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK
        run: |
          set -eo pipefail
          {
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-3* | sort -V | tail -1)/android.jar
          echo "build-tools: $BT  plataforma: $PLAT"
          mkdir -p out/gen out/obj out/dex build app/assets
          cp index.html app/assets/index.html
          curl -fL --retry 3 -o app/assets/maplibre-gl.js https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js
          curl -fL --retry 3 -o app/assets/maplibre-gl.css https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css
          sed -i 's#https://unpkg.com/maplibre-gl@4.7.1/dist/##g' app/assets/index.html
          grep -c 'maplibre-gl' app/assets/index.html
          "$BT"/aapt2 compile --dir app/res -o out/res.zip
          "$BT"/aapt2 link -o out/base.apk -I "$PLAT" --manifest app/AndroidManifest.xml -A app/assets --java out/gen \
            --min-sdk-version 26 --target-sdk-version 34 --version-code ${{ github.run_number }} --version-name "1.${{ github.run_number }}" out/res.zip
          javac -source 11 -target 11 -classpath "$PLAT" -d out/obj $(find app/src out/gen -name '*.java')
          "$BT"/d8 --lib "$PLAT" --min-api 26 --output out/dex $(find out/obj -name '*.class')
          (cd out/dex && zip -q ../base.apk classes.dex)
          "$BT"/zipalign -f -p 4 out/base.apk out/aligned.apk
          "$BT"/apksigner sign --ks android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --out build/TesoroAlbacete.apk out/aligned.apk
          "$BT"/apksigner verify --verbose build/TesoroAlbacete.apk | head -5
          "$BT"/aapt2 dump badging build/TesoroAlbacete.apk | head -8
          ls -la build
          } 2>&1 | tee build.log

      - name: Publicar para descargar desde el móvil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tesoro-albacete-v${{ github.run_number }}
          name: Tesoro de Albacete v${{ github.run_number }}
          target_commitish: tesoro-albacete
          body: Descarga TesoroAlbacete.apk desde el móvil e instálalo.
          files: build/TesoroAlbacete.apk

      - name: Guardar el registro de compilación
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "sin registro" > /tmp/log/build.log
          echo "run ${{ github.run_number }} ${{ job.status }}" > /tmp/log/estado.txt
          cd /tmp/log && git init -q -b tesoro-albacete-log
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Registro ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tesoro-albacete-log || true
